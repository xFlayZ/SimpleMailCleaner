services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: simplemailcleaner
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smc -d simplemailcleaner"]
      interval: 5s
      retries: 15
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://smc:${POSTGRES_PASSWORD}@db:5432/simplemailcleaner
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://smc:${POSTGRES_PASSWORD}@db:5432/simplemailcleaner
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://smc:${POSTGRES_PASSWORD}@db:5432/simplemailcleaner
    command: ["npm", "run", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  postgres:
